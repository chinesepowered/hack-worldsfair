name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @sotto/sdk exec tsc -p tsconfig.json --noEmit
      # unit + fake-settler protocol tests; the local-validator and live-chain tests skip without their env
      - run: pnpm --filter @sotto/sdk test
