<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 92" width="280" height="184" role="img" aria-label="Capy, the sotto capybara, resting on a redacted ledger row">
  <title>Capy</title>
  <!-- the amount nobody can read -->
  <rect x="8" y="74" width="124" height="12" rx="2" fill="#e2664f"/>
  <!-- body -->
  <ellipse cx="60" cy="52" rx="42" ry="24" fill="#e6ece7"/>
  <!-- blunt head, overlapping the body's front -->
  <rect x="82" y="20" width="46" height="42" rx="15" fill="#e6ece7"/>
  <rect x="104" y="36" width="28" height="26" rx="11" fill="#e6ece7"/>
  <!-- ear -->
  <circle cx="95" cy="22" r="6.5" fill="#e6ece7"/>
  <!-- closed eye -->
  <path d="M104 35 q4.5 3.5 9 0" stroke="#0f1613" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- nostril -->
  <circle cx="125" cy="46" r="1.9" fill="#0f1613"/>
  <!-- tucked legs, resting on the bar -->
  <rect x="30" y="64" width="16" height="12" rx="5" fill="#e6ece7"/>
  <rect x="68" y="64" width="16" height="12" rx="5" fill="#e6ece7"/>
</svg>
